# ============================================================
#  RIVALS – areny
#
#  Areny są generowane przez plugin w pustym świecie (arena-world.name).
#  Układ współrzędnych (względem środka areny):
#    x, z  – od -size/2 do +size/2 (35 => -17..17)
#    y = 0 – podłoga, gracze stoją na y = 1
#    ściana startowa stoi na z = 0, gracze startują na z = -spawn-distance i +spawn-distance
#
#  "structures" opisujesz TYLKO dla połowy z < 0 – plugin sam robi lustrzane odbicie (z -> -z),
#  więc arena jest zawsze symetryczna. Flaga "mx" dodatkowo odbija strukturę po osi X.
#
#  Składnia:
#    box    <klucz> x1 y1 z1 x2 y2 z2 [mx]                         – pełny prostopadłościan
#    block  <klucz> x y z [mx]                                      – pojedynczy blok
#    stairs <klucz> <podpora> x y z <kierunek> <stopnie> <szer> [mx] – schody wznoszące się w danym kierunku
#    air    x1 y1 z1 x2 y2 z2 [mx]                                  – wycięcie (np. dziura w podłodze)
#  <klucz> to nazwa z sekcji "palette".
#
#  Dekoracje (display entities, max decorations.max-per-arena):
#    <typ> x y z [yaw] [mx] [single]   typy: fan, lamp, logo, pipe, screen
#    domyślnie lustro z -> -z (yaw -> 180 - yaw); mx = także lustro po X; single = bez lustra
# ============================================================
config-version: 2

arenas:

  lab:
    enabled: true
    display-name: "Laboratorium"
    # Grawitacja (vanilla 0.08).
    gravity: 0.08
    # Czas dnia widziany przez graczy na arenie (0–24000).
    time: 6000
    size: 35
    spawn-distance: 6
    wall: { block: "minecraft:packed_ice", width: 9, height: 5 }
    palette:
      floor: "minecraft:white_concrete"
      floor-alt: "minecraft:smooth_quartz"
      line: "minecraft:light_blue_concrete"
      edge: "minecraft:sea_lantern"
      cover: "minecraft:light_gray_concrete"
      cover-alt: "minecraft:cyan_terracotta"
      glass: "minecraft:light_blue_stained_glass"
      tank: "minecraft:packed_ice"
      stair: "minecraft:quartz_stairs"
    structures:
      # Zbiorniki kriogeniczne przy linii środkowej (pełna osłona, 4 wysokości)
      - "box tank -7 1 -4 -6 4 -3 mx"
      # Niskie skrzynie przy bokach linii środkowej (osłona do kucania)
      - "box cover-alt -12 1 -2 -10 1 -1 mx"
      # Ścianki za strefą startową
      - "box cover -4 1 -11 -2 2 -11 mx"
      # Boczne osłony w połowie dystansu
      - "box cover -15 1 -8 -14 2 -6 mx"
      # Platformy narożne (2. poziom) + barierka szklana + schody
      - "box cover -16 1 -16 -12 3 -12 mx"
      - "box glass -16 4 -12 -13 4 -12 mx"
      - "stairs stair cover -9 1 -13 west 3 2 mx"
      # Kładka obserwacyjna z tyłu (3. poziom) + schody + barierka
      - "stairs stair cover -10 1 -16 east 6 2 mx"
      - "box cover -4 1 -16 -4 5 -15 mx"
      - "box cover -4 6 -16 4 6 -15"
      - "box glass -3 7 -15 3 7 -15"
    decorations:
      - "logo 0 10 0 0 single"
      - "fan 0 4 -19 0"
      - "screen -9 5 -19 0 mx"
      - "lamp -17 1 -17 0 mx"
      - "lamp -17 1 -9 0 mx"
      - "pipe -19 2 -6 90 mx"

  neon:
    enabled: true
    display-name: "Neonowy dach"
    gravity: 0.08
    time: 18000
    size: 35
    spawn-distance: 6
    wall: { block: "minecraft:magenta_stained_glass", width: 9, height: 5 }
    palette:
      floor: "minecraft:black_concrete"
      floor-alt: "minecraft:polished_blackstone"
      line: "minecraft:magenta_concrete"
      edge: "minecraft:pearlescent_froglight"
      cover: "minecraft:gray_concrete"
      cover-alt: "minecraft:cyan_concrete"
      glass: "minecraft:magenta_stained_glass"
      tank: "minecraft:light_gray_concrete"
      stair: "minecraft:polished_blackstone_brick_stairs"
    structures:
      # Klimatyzatory
      - "box tank -8 1 -9 -6 2 -8 mx"
      # Kominy wentylacyjne przy środku
      - "box cover -13 1 -4 -12 4 -3 mx"
      # Niski murek przed strefą startową
      - "box cover-alt -3 1 -3 3 1 -3"
      # Platforma bilbordu (2. poziom) + schody + barierka
      - "box cover -16 1 -10 -13 3 -6 mx"
      - "stairs stair cover -10 1 -9 west 3 2 mx"
      - "box glass -16 4 -6 -14 4 -6 mx"
      # Wieża ciśnień (3. poziom): nogi, pokład, schody, barierka
      - "box cover -3 1 -16 -3 4 -16 mx"
      - "box cover -3 1 -14 -3 4 -14 mx"
      - "box cover -3 5 -16 3 5 -14"
      - "stairs stair cover -8 1 -16 east 5 1 mx"
      - "box glass -2 6 -14 2 6 -14"
    decorations:
      - "logo 0 11 0 0 single"
      - "screen -6 6 -19 0 mx"
      - "screen -14 6 -19 0 mx"
      - "lamp -17 1 -17 0 mx"
      - "lamp -17 1 -11 0 mx"
      - "lamp -17 1 -5 0 mx"
      - "fan -19 3 -12 90 mx"

  orbital:
    enabled: true
    display-name: "Stacja orbitalna"
    # Niska grawitacja (atrybut gravity).
    gravity: 0.04
    time: 18000
    size: 35
    spawn-distance: 6
    wall: { block: "minecraft:iron_block", width: 9, height: 5 }
    palette:
      floor: "minecraft:light_gray_concrete"
      floor-alt: "minecraft:white_concrete"
      line: "minecraft:orange_concrete"
      edge: "minecraft:ochre_froglight"
      cover: "minecraft:polished_andesite"
      cover-alt: "minecraft:white_concrete"
      glass: "minecraft:white_stained_glass"
      tank: "minecraft:iron_block"
      stair: "minecraft:polished_andesite_stairs"
    structures:
      # Kontenery ładunkowe
      - "box tank -9 1 -5 -8 2 -4 mx"
      # Cylindry paliwa
      - "box cover -4 1 -12 -3 3 -11 mx"
      # Niska bariera przecinająca linię środkową
      - "box cover-alt -14 1 -2 -12 1 -1 mx"
      # Boczne platformy (2. poziom), łączą się nad linią środkową + schody
      - "box cover -16 1 -5 -14 3 -1 mx"
      - "stairs stair cover -11 1 -4 west 3 2 mx"
      # Pokład obserwacyjny (3. poziom): nogi, pokład, schody, barierka
      - "box cover -3 1 -16 -3 4 -16 mx"
      - "box cover -3 1 -14 -3 4 -14 mx"
      - "box cover -3 5 -16 3 5 -14"
      - "stairs stair cover -8 1 -16 east 5 1 mx"
      - "box glass -2 6 -14 2 6 -14"
    decorations:
      - "logo 0 12 0 0 single"
      - "fan -8 4 -19 0 mx"
      - "screen 0 7 -19 0"
      - "lamp -17 1 -17 0 mx"
      - "pipe -19 1 -10 90 mx"
      - "pipe -19 3 -3 90 mx"
